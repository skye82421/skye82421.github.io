<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>解鎖碼產生器（僅限老師使用）</title>
<style>
:root{--bg:#f3ead9;--card:#fffcf6;--tx:#33281f;--ac:#a63a2f;--line:#e0d3bd;--mute:#7d6e62;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1613;--card:#2a211c;--tx:#f1e7da;--ac:#c4553f;--line:#463a31;--mute:#bba995;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1613;--card:#2a211c;--tx:#f1e7da;--ac:#c4553f;--line:#463a31;--mute:#bba995;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:"PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.7}
.w{max-width:480px;margin:0 auto;padding:20px 16px}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
input,select{width:100%;font:inherit;font-size:16px;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}
input{width:100%;font:inherit;font-size:16px;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}
button{width:100%;font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px;background:var(--ac);color:#fff;margin-top:10px;cursor:pointer}
.code{font-size:30px;font-weight:700;letter-spacing:.12em;text-align:center;color:var(--ac);margin:6px 0}
.n{font-size:13px;color:var(--mute)}pre{white-space:pre-wrap;font:inherit;background:var(--bg);padding:10px;border-radius:10px}
</style></head><body><div class="w">
<h2>🔑 解鎖碼產生器</h2><p class="n">確認客人付款後使用。請勿分享此頁面連結。</p>
<div class="c"><label>客人的國曆生日（請客人用查詢頁的生日）</label><input id="d" type="date">
<label style="display:block;margin-top:10px">客人購買的方案</label><select id="p"><option value="A">解鎖大方向運勢體驗版 $399</option><option value="B">流年完整版 $1,800</option><option value="C">完整命盤解析 $3,600</option><option value="L">單一事項詢問・感情 $1,200</option><option value="K">單一事項詢問・事業 $1,200</option><option value="W">單一事項詢問・財運 $1,200</option></select>
<button id="g">產生解鎖碼</button></div>
<div class="c" id="o" style="display:none"><div class="n">解鎖碼</div><div class="code" id="k"></div>
<pre id="m"></pre><button id="cp">複製回覆訊息</button><div class="n" id="s"></div></div>
</div><script>
const SALT="yuanyuan-2027-Q8zV4kR1";
function h53(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)}
const PLANS={A:"解鎖大方向運勢體驗版",B:"流年完整版",C:"完整命盤解析",L:"單一事項詢問・感情",K:"單一事項詢問・事業",W:"單一事項詢問・財運"};
function mkCode(date,p){const c=h53(SALT+p+date).toString(36).toUpperCase().padStart(8,"0").slice(-8);return c.slice(0,4)+"-"+c.slice(4)}

const $=id=>document.getElementById(id);let msg="";
$("g").onclick=function(){const v=$("d").value,p=$("p").value;if(!v){alert("請先選擇生日");return}
 const c=mkCode(v,p);$("k").textContent=c;
 msg="已確認收款，謝謝你！\n方案：「"+PLANS[p]+"」\n你的 2027 解鎖碼：「"+c+"」\n回到查詢頁，輸入同一個生日（"+v+"）查詢後，在『完整報告』處貼上即可解鎖。\n圓圓老師陪你圓夢成真 ✨";
 $("m").textContent=msg;$("o").style.display="block"};
$("cp").onclick=function(){try{navigator.clipboard.writeText(msg).then(()=>{$("s").textContent="已複製 ✓"},()=>{$("s").textContent="請手動複製上方文字"})}catch(e){$("s").textContent="請手動複製上方文字"}};
</script></body></html>
